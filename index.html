<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Sarah Bell | Software Developer</title>

    <link href="https://fonts.googleapis.com/css2?family=Allura&family=Bodoni+Moda:opsz@6..96&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
  </head>

  <body>
    <header>
      <div class="name">Sarah BELL</div>
      <nav aria-label="Primary">
        <a href="#work">Work</a>
        <a href="#about">About</a>
        <a href="#contact">Contact</a>
      </nav>
    </header>

    <main>
      <section class="hero" id="work">
        <div class="ring-wrap">
          <div class="centre-copy">
            <h1>
              <span class='first-name'>Sarah</span>
              <span class='last-name'>BELL</span>
            </h1>
            <p>Software Developer</p>
          </div>

          <svg id="ring" viewBox="-50 -50 100 100" aria-hidden="false" role="list"></svg>
        </div>
      </section>

     <section id="project-details" hidden>
      <h2 id="details-title"></h2>
      <div class="details-image-wrapper">
        <img id="details-img" />
      </div>
      <p id="details-client"></p>
      <p id="details-text"></p>
      <a id="details-link" target="_blank" rel="noopener">Visit project</a>
    </section>
    </main>

    <script src="script.js"></script>
  </body>
</html>
